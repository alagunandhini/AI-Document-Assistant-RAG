<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Document Intelligence Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            margin-top: 15px;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.9;
        }

        .upload-btn {
            background: #333;
            color: white;
        }

        .ask-btn {
            background: #555;
            color: white;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }

        .answer {
            margin-top: 20px;
            padding: 18px;
            background: #f1f3f5;
            border-radius: 8px;
            line-height: 1.6;
            white-space: pre-wrap;
            display: none;
        }

        .loading {
            color: #666;
            font-style: italic;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>AI Document Intelligence Assistant</h1>

            <p>
                Upload a PDF and ask questions using Retrieval-Augmented Generation.
            </p>
        </div>


        <!-- Upload Card -->

        <div class="card">

            <h2>📄 Upload Document</h2>

            <input
                type="file"
                id="pdfFile"
                accept=".pdf"
            >

            <button
                class="upload-btn"
                onclick="uploadDocument()"
            >
                Upload PDF
            </button>

            <div
                id="status"
                class="status"
            ></div>

        </div>


        <!-- Question Card -->

        <div class="card">

            <h2>💬 Ask a Question</h2>

            <input
                type="text"
                id="question"
                placeholder="Ask something about your document..."
                onkeydown="handleEnter(event)"
            >

            <button
                class="ask-btn"
                onclick="askQuestion()"
            >
                Ask Question
            </button>

            <div
                id="answer"
                class="answer"
            ></div>

        </div>


        <div class="footer">
            Built with Python • FastAPI • ChromaDB • Embeddings • Gemini
        </div>

    </div>


    <script>

        async function uploadDocument() {

            const fileInput =
                document.getElementById("pdfFile");

            const status =
                document.getElementById("status");

            if (!fileInput.files.length) {

                showStatus(
                    "Please select a PDF file.",
                    true
                );

                return;
            }

            const formData = new FormData();

            formData.append(
                "file",
                fileInput.files[0]
            );

            showStatus(
                "Uploading and processing document...",
                false
            );

            try {

                const response =
                    await fetch(
                        "http://127.0.0.1:8000/upload",
                        {
                            method: "POST",
                            body: formData
                        }
                    );

                const data =
                    await response.json();

                if (data.error) {

                    showStatus(
                        data.error,
                        true
                    );

                    return;
                }

                showStatus(
                    `✓ ${data.filename} uploaded successfully. ${data.chunks_created} chunks created.`,
                    false
                );

            } catch (error) {

                showStatus(
                    "Unable to connect to FastAPI.",
                    true
                );

                console.error(error);
            }
        }


        async function askQuestion() {

            const question =
                document.getElementById("question").value.trim();

            const answer =
                document.getElementById("answer");

            if (!question) {

                answer.style.display = "block";

                answer.innerText =
                    "Please enter a question.";

                return;
            }

            answer.style.display = "block";

            answer.className = "answer loading";

            answer.innerText =
                "Thinking...";

            try {

                const response =
                    await fetch(
                        "http://127.0.0.1:8000/ask",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                question: question
                            })
                        }
                    );

                const data =
                    await response.json();

                answer.className = "answer";

                answer.innerText =
                    data.answer;

            } catch (error) {

                answer.className = "answer";

                answer.innerText =
                    "Unable to connect to FastAPI.";

                console.error(error);
            }
        }


        function handleEnter(event) {

            if (event.key === "Enter") {

                askQuestion();

            }
        }


        function showStatus(message, error) {

            const status =
                document.getElementById("status");

            status.style.display = "block";

            status.innerText = message;

            if (error) {
                status.style.background = "#ffe5e5";
            } else {
                status.style.background = "#e8f5e9";
            }
        }

    </script>

</body>

</html>
